# Merge gate for the landing + teacher console (apps/web). The real deploy is
# Cloudflare Workers Builds ("Connect GitHub") on push to main — see
# apps/web/wrangler.toml and docs/launch/web-app-launch.md §2-E. This job only
# proves the static export builds, the landing lays out on phones (Playwright
# over apps/web/out) and the Worker config is valid.
name: Web Console (static export)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/design-system/**"
      - "packages/content-schema/**"
      - "packages/i18n/**"
      # the scene contact sheet (/design-preview/scenes) is built from these files
      - "content/stories/**"
      - ".github/workflows/preview-deploy.yml"

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build console · wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export (next build → apps/web/out)
        run: pnpm --filter @hangul-route/web build

      - name: Exported pages exist
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/teach.html
          test -f apps/web/out/teach/space.html
          test -f apps/web/out/teach/space/settings.html
          test -f apps/web/out/teach/space/learner.html
          test -f apps/web/out/teach/space/report.html
          test -f apps/web/out/parent/learner.html
          test -f apps/web/out/404.html
          test -f apps/web/out/design-preview/scenes.html
          test -f apps/web/out/design-preview/scenes/library.html

      # F-SITE-002 S-9: the site pages and the metadata routes are in the export. Names are whole segments, so
      # `teachers.html` and `parents.html` never stand in for `teach.html` or `parent.html`.
      - name: Site pages, robots.txt and sitemap.xml exist (F-SITE-002 S-9)
        run: |
          for f in index.html learners.html parents.html teachers.html robots.txt sitemap.xml; do
            test -f "apps/web/out/$f" || { echo "missing apps/web/out/$f"; exit 1; }
          done
          grep -qx 'Disallow: /design-preview' apps/web/out/robots.txt
          grep -qx 'Sitemap: https://hangulroute.com/sitemap.xml' apps/web/out/robots.txt
          for page in '' /learners /parents /teachers /about /privacy /terms; do
            grep -q "<loc>https://hangulroute.com${page:-/}</loc>" apps/web/out/sitemap.xml || { echo "sitemap misses ${page:-/}"; exit 1; }
          done
          # never a grown-up path or the contact sheets, at the root or under a locale prefix (whole segments).
          # The alternation is GROWN_UP_PREFIXES (packages/content-schema app-shell.ts) plus design-preview;
          # site-surface.test.ts fails when the two drift apart.
          if grep -Eq 'hangulroute\.com(/[a-z]{2})?/(signin|start|teach|parent|account|design-preview)([/.?"<]|$)' apps/web/out/sitemap.xml; then
            echo "sitemap.xml lists a grown-up path or /design-preview"; exit 1
          fi

      # There is no per-PR preview URL (Workers Builds deploys main only), so the
      # built export is attached to the run: art reviewers download it, run
      # `tar -xzf web-export.tgz` and `node apps/web/e2e/serve-out.mjs out`, then
      # open /design-preview/scenes. Tarred as one download; no exported file name
      # holds a colon since #237 (apps/web/e2e/parent-demo.spec.ts checks it).
      - name: Pack static export
        run: tar -czf web-export.tgz -C apps/web out

      - name: Upload static export (contact sheet review)
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: web-export.tgz
          retention-days: 7
          if-no-files-found: error

      # The expected set follows LOCALE_STATUS (packages/i18n/src/locales.ts): a shipped locale is exported with
      # its own <html lang>, no hidden marker, no noindex and a sitemap entry; a hidden one is absent. A rollback
      # (runbook §I: a locale back to 'hidden') keeps this green.
      - name: Exported locales match LOCALE_STATUS (F-I18N-001 PR 11b, rows 15b / 16b)
        run: node scripts/check-locale-export.mjs apps/web/out

      - name: Install Playwright Chromium
        run: pnpm --filter @hangul-route/web exec playwright install --with-deps chromium

      - name: Landing layout e2e (no sideways scroll, "Play now" visible, focus order)
        run: pnpm --filter @hangul-route/web test:e2e

      - name: Validate wrangler config (dry run, no upload)
        run: pnpm --filter @hangul-route/web exec wrangler deploy --dry-run

      # Last, because it replaces apps/web/out: a QA build exports every locale with its own <html lang>.
      - name: QA build exports /es and /ko with their lang (F-I18N-001 PR 11b)
        env:
          NEXT_PUBLIC_SHOW_ALL_LOCALES: "1"
        run: |
          pnpm --filter @hangul-route/web build
          grep -q '<html lang="es"' apps/web/out/es.html
          grep -q '<html lang="es"' apps/web/out/es/about.html
          grep -q '<html lang="ko"' apps/web/out/ko.html
          grep -q '<html lang="ko"' apps/web/out/ko/privacy.html
          grep -q '<html lang="en"' apps/web/out/index.html
          # shown on a QA build: no hidden marker, no noindex (`! grep` would not fail the step under bash -e)
          for f in es.html es/about.html ko.html ko/privacy.html; do
            if grep -Eq 'data-hr-hidden-locale|noindex' "apps/web/out/$f"; then echo "$f is still marked hidden"; exit 1; fi
          done
          grep -q 'href="/es/about"' apps/web/out/es.html
          grep -q 'href="/ko/privacy"' apps/web/out/ko.html
          # F-SITE-002 S-9: the QA sitemap names the shown locales with hreflang alternates
          grep -q '<loc>https://hangulroute.com/es/teachers</loc>' apps/web/out/sitemap.xml
          grep -q 'hreflang="ko" href="https://hangulroute.com/ko/learners"' apps/web/out/sitemap.xml
