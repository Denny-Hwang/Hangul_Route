# Merge gate for the landing + teacher console (apps/web). The real deploy is
# Cloudflare Workers Builds ("Connect GitHub") on push to main — see
# apps/web/wrangler.toml and docs/launch/web-app-launch.md §2-E. This job only
# proves the static export builds, the landing lays out on phones (Playwright
# over apps/web/out) and the Worker config is valid.
name: Web Console (static export)

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/web/**"
      - "packages/design-system/**"
      - "packages/content-schema/**"
      # the scene contact sheet (/design-preview/scenes) is built from these files
      - "content/stories/**"
      - ".github/workflows/preview-deploy.yml"

concurrency:
  group: preview-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build console · wrangler dry-run
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build static export (next build → apps/web/out)
        run: pnpm --filter @hangul-route/web build

      - name: Exported pages exist
        run: |
          test -f apps/web/out/index.html
          test -f apps/web/out/teach.html
          test -f apps/web/out/teach/space.html
          test -f apps/web/out/teach/space/settings.html
          test -f apps/web/out/404.html
          test -f apps/web/out/design-preview/scenes.html
          test -f apps/web/out/design-preview/scenes/library.html

      # There is no per-PR preview URL (Workers Builds deploys main only), so the
      # built export is attached to the run: art reviewers download it and serve
      # it with `node apps/web/e2e/serve-out.mjs <dir>` to open /design-preview/scenes.
      - name: Upload static export (contact sheet review)
        uses: actions/upload-artifact@v4
        with:
          name: web-export
          path: apps/web/out
          retention-days: 7
          if-no-files-found: error

      - name: Install Playwright Chromium
        run: pnpm --filter @hangul-route/web exec playwright install --with-deps chromium

      - name: Landing layout e2e (no sideways scroll, "Play now" visible, focus order)
        run: pnpm --filter @hangul-route/web test:e2e

      - name: Validate wrangler config (dry run, no upload)
        run: pnpm --filter @hangul-route/web exec wrangler deploy --dry-run
