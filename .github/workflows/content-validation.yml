name: Content Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "content/**"
      - "packages/content-schema/**"
      # F-CNT-002: the romanization suites read these sources (registry: packages/content-schema/src/__tests__/helpers/romanization-registry.ts)
      - "apps/mobile/src/content/**"
      - "apps/mobile/src/logic/minigame-config.ts"
      - "apps/mobile/src/logic/profiles/avatar-catalog.ts"
      - "apps/mobile/src/logic/lecture/content.ts"
      - "apps/mobile/src/logic/stage1/hangul-check.ts"
      - "apps/mobile/src/screens/minigames/VoiceEchoGame.tsx"
      - "apps/web/src/data/**"
      - "apps/web/src/components/landing/**"
      - "apps/web/src/app/(console)/design-preview/**"
      - "apps/web/src/__tests__/romanization-sources.test.ts"
      - "packages/backend/src/routes/content.ts"
      - "packages/backend/src/__tests__/content-route.test.ts"
      - "scripts/build-stories.mjs"
      - "apps/mobile/src/content/stories.generated.ts"
      - "scripts/build-vocab.mjs"
      - "apps/mobile/src/content/__generated__/vocab.ts"
      - "apps/web/src/data/vocab-catalog.ts"
      - "scripts/build-placement-bank.mjs"
      - "scripts/placement-rules.mjs"
      - "apps/mobile/src/content/placement.generated.ts"
      # F-I18N-001 PR 12: content overlays (generator, allow-list, validator rules)
      - "scripts/build-overlays.mjs"
      - "scripts/overlay-fields.mjs"
      - "scripts/overlay-rules.mjs"
      - "scripts/validate-content.mjs"
      - "packages/i18n/src/banned-words.json"
      - ".github/workflows/content-validation.yml"
      # F-TCH-004 PR 10: lecture catalogue mirror (stories and vocabulary topics for the console)
      - "scripts/build-lecture-catalogue.mjs"
      - "apps/web/src/data/lecture-catalogue.generated.ts"
      # F-STORY-001 PR 1.5: story version rules
      - "scripts/check-story-versions.mjs"
      # F-TCH-004 PR 3: presenter font glyph list (re-derived from the content above)
      - "scripts/build-presenter-font.mjs"
      - "apps/mobile/public/fonts/**"

# F-I18N-001 §3.10: overlay locales whose missing translations are errors (comma list, e.g. "es").
# Add a locale here in the PR that flips its LOCALE_STATUS to 'shipped'; scripts/i18n-status.mjs
# (ci.yml) fails a shipped locale that is not listed. Read by validate-content.mjs and the vocab suite.
env:
  HANGUL_ROUTE_STRICT_LOCALES: ""

concurrency:
  group: content-validation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: zod schema + language policy
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # F-STORY-001 §3.7: check-story-versions.mjs compares each story with origin/main.
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run content-schema tests (zod fixtures)
        run: pnpm --filter @hangul-route/content-schema test

      - name: Romanization suites - mobile data (F-CNT-002)
        run: pnpm --filter @hangul-route/mobile test -t romanization

      - name: Romanization suites - web data and inline pages (F-CNT-002)
        run: pnpm --filter @hangul-route/web test -t romanization

      - name: Romanization suites - backend seed (F-CNT-002)
        run: pnpm --filter @hangul-route/backend test -t romanization

      - name: Validate language policy (F-CNT-001)
        run: node scripts/validate-content.mjs

      - name: Vocabulary modules are up to date (F-VOC-001)
        run: pnpm run vocab:check

      - name: Placement bank is up to date (F-PLC-001)
        run: node scripts/build-placement-bank.mjs --check

      - name: Content overlays are up to date (F-I18N-001)
        run: node scripts/build-overlays.mjs --check

      - name: Story bundle is up to date (F-STORY-001)
        run: node scripts/build-stories.mjs --check

      - name: Story bundle budget (F-STORY-001)
        run: node scripts/build-stories.mjs --report

      - name: Lecture catalogue is up to date (F-TCH-004)
        run: node scripts/build-lecture-catalogue.mjs --check

      - name: Presenter font glyph list is up to date (F-TCH-004 §3.6)
        run: node scripts/build-presenter-font.mjs --check

      - name: Presenter font budget (F-TCH-004 §3.6)
        run: node scripts/build-presenter-font.mjs --report

      - name: Story versions are raised (F-STORY-001 §3.7)
        # Plain Node, no install needed: report even when an earlier step failed.
        if: ${{ !cancelled() }}
        run: node scripts/check-story-versions.mjs --base origin/main
