name: CI

# Required checks (ruleset main-protection) live here as two small jobs:
#   'lint · typecheck · test · build'      passes only when `checks` and both `unit` jobs pass;
#   'Measure coverage vs rolling targets'  reads the coverage the `unit` jobs wrote.
# The tests run ONCE, with coverage (`test:coverage`, the same vitest suites as `test`), split
# over two parallel jobs; the coverage check reuses their reports instead of running the suites
# again. Both required jobs use if: always(), because a skipped required check counts as passed.
# scripts/__tests__/ci-workflows.test.mjs keeps this layout honest.
#
# Turbo cache: restored and saved under the exact git tree (lockfile included), so it only
# replays tasks of an identical tree, i.e. a re-run of a failed job skips the tasks that
# already passed on that same tree. A new commit never reuses an earlier result.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint · typecheck · build · repo checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-workspace

      - name: Git tree of this run (turbo cache key)
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the turbo cache of this exact tree
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.tree.outputs.tree }}

      # Next's own incremental build cache (webpack); Next validates every entry itself.
      # Pull requests restore main's cache; main builds cold and saves a fresh one, so the
      # cache never grows run over run.
      - name: Restore the Next.js build cache (apps/web, site role; pull requests)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: next-site-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-site-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Lint, typecheck and build (one turbo run, tasks in parallel)
        run: pnpm exec turbo run lint typecheck build

      - name: Check i18n rules (F-I18N-001)
        run: node scripts/check-i18n.mjs

      - name: UI translation status - fails on missing keys in a shipped locale (F-I18N-001)
        # On a pull request, --base compares LOCALE_STATUS with the target branch, so the PR
        # that flips a locale to 'shipped' needs every native review current (F-I18N-001 §3.10).
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          if [ -n "$BASE_REF" ]; then
            git fetch --no-tags --depth=1 origin "$BASE_REF"
            node scripts/i18n-status.mjs --base FETCH_HEAD
          else
            node scripts/i18n-status.mjs
          fi

      - name: Validate API wrangler config (dry run, no upload)
        run: pnpm --filter @hangul-route/api exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Apply D1 migrations to a local database (validates the SQL)
        run: pnpm --filter @hangul-route/api exec wrangler d1 migrations apply hangul-route --local
        env:
          WRANGLER_SEND_METRICS: "false"

      - name: Save the turbo cache of this tree (also after a failure, for a re-run)
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true' && steps.tree.outputs.tree != ''
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-checks-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.tree.outputs.tree }}

      - name: Save the Next.js build cache (main only)
        if: github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: next-site-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  unit:
    name: Unit tests · ${{ matrix.group }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [mobile, packages]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-workspace

      - name: Git tree of this run (turbo cache key)
        id: tree
        run: echo "tree=$(git rev-parse 'HEAD^{tree}')" >> "$GITHUB_OUTPUT"

      - name: Restore the turbo cache of this exact tree
        id: turbo-cache
        uses: actions/cache/restore@v4
        with:
          path: .turbo/cache
          key: turbo-unit-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.tree.outputs.tree }}

      # apps/mobile alone is about half of all the vitest work, so it gets its own job.
      - name: Unit tests with coverage (apps/mobile)
        if: matrix.group == 'mobile'
        run: pnpm exec turbo run test:coverage --filter=@hangul-route/mobile

      - name: Test enforcement scripts (T-019)
        if: matrix.group == 'mobile'
        run: pnpm run test:scripts

      - name: Unit tests with coverage (every other workspace)
        if: matrix.group == 'packages'
        run: pnpm exec turbo run test:coverage --filter='!@hangul-route/mobile'

      - name: Test the API against SQLite (real D1 migrations, F-INFRA-003)
        if: matrix.group == 'packages'
        run: pnpm --filter @hangul-route/backend test:sqlite

      - name: Pack the coverage reports
        run: |
          find apps packages -path '*/node_modules' -prune -o -type f -path '*/coverage/*' \
            \( -name coverage-summary.json -o -name lcov.info \) -print > coverage-files.txt
          cat coverage-files.txt
          # tar writes an archive even from an empty list, so an empty list fails here.
          if [ ! -s coverage-files.txt ]; then
            echo "::error::No coverage reports found for ${{ matrix.group }}."
            exit 1
          fi
          tar -cf "coverage-${{ matrix.group }}.tar" -T coverage-files.txt

      - name: Upload the coverage reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-${{ matrix.group }}
          path: coverage-${{ matrix.group }}.tar
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Save the turbo cache of this tree (also after a failure, for a re-run)
        if: always() && steps.turbo-cache.outputs.cache-hit != 'true' && steps.tree.outputs.tree != ''
        uses: actions/cache/save@v4
        with:
          path: .turbo/cache
          key: turbo-unit-${{ matrix.group }}-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ steps.tree.outputs.tree }}

  coverage:
    name: Measure coverage vs rolling targets
    needs: [unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Both unit test jobs passed
        env:
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "unit tests: $UNIT"
          if [ "$UNIT" != success ]; then
            echo "::error::The unit test jobs did not pass ($UNIT), so there is no coverage to measure."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Check coverage-targets md ↔ json drift (F-COV-002)
        run: node scripts/check-coverage-targets-drift.mjs

      - name: Download the coverage reports of the unit test jobs
        uses: actions/download-artifact@v4
        with:
          pattern: coverage-*
          path: coverage-parts
          merge-multiple: true

      - name: Unpack the coverage reports into their workspaces
        run: |
          for t in coverage-parts/*.tar; do tar -xvf "$t"; done

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          overwrite: true
          path: |
            **/coverage/coverage-summary.json
            **/coverage/lcov.info
          if-no-files-found: warn
          retention-days: 14

      # --fail-on-skip: the reports come from the unit jobs, so a target with no report
      # means a report was lost on the way, and fails instead of being skipped.
      - name: Enforce rolling targets (F-COV-001)
        run: node scripts/coverage-gate.mjs --fail-on-skip

  ci:
    name: lint · typecheck · test · build
    needs: [checks, unit]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every CI job passed
        env:
          CHECKS: ${{ needs.checks.result }}
          UNIT: ${{ needs.unit.result }}
        run: |
          echo "lint · typecheck · build · repo checks: $CHECKS"
          echo "unit tests (mobile, packages): $UNIT"
          if [ "$CHECKS" != success ] || [ "$UNIT" != success ]; then
            echo "::error::A CI job did not pass."
            exit 1
          fi
