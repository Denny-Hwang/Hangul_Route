name: Web App (PWA) Deploy

on:
  pull_request:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"
      - ".github/workflows/web-app-deploy.yml"
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

concurrency:
  group: web-app-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build PWA · offline e2e · Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CF_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    permissions:
      contents: read
      deployments: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build PWA (expo export + service worker)
        run: pnpm --filter @hangul-route/mobile build:web

      - name: Install Playwright Chromium
        run: pnpm --filter @hangul-route/mobile exec playwright install --with-deps chromium

      - name: Offline e2e
        run: pnpm --filter @hangul-route/mobile test:e2e:web

      - name: Skip upload (secrets not configured)
        if: ${{ env.CF_API_TOKEN == '' }}
        run: |
          echo "::notice::CLOUDFLARE_API_TOKEN not set — skipping Pages upload."
          echo "::notice::Set repo secrets CLOUDFLARE_API_TOKEN + CLOUDFLARE_ACCOUNT_ID to enable."

      - name: Publish to Cloudflare Pages (hangul-route-app)
        if: ${{ env.CF_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/mobile/dist --project-name=hangul-route-app --branch=${{ github.head_ref || github.ref_name }}
