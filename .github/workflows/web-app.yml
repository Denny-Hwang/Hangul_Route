name: Web App (PWA)

# Merge gate for the learner web app: build the static export + service
# worker and run the offline Playwright e2e. Deployment itself is done by
# Cloudflare Workers Builds (Connect GitHub) on every push to main — see
# docs/launch/web-app-launch.md §2 — so this workflow never uploads.
#
# Layout (CI speed-up, 2026-10-12): one `build` job writes the bundles (the
# release build dist/ and the fixture build dist-e2e/, back to back so the
# second reuses the warm Metro cache; then the gating fixture build
# dist-e2e-gated/ on a cache of its own, F-STORY-004 PR 4.8b) and hands them
# to 4 parallel e2e shards; each runs its share of the release-build suite
# and of the fixture-bundle specs (dealt round-robin by test,
# scripts/e2e-shard-list.mjs, so the shards come out even); shard 1 also
# runs the gating-bundle spec, and shard 2 the weekly plan bundle's specs
# (dist-e2e-route/, F-PLAN-002 P2-8). The required check
# 'Build PWA · offline e2e' is the last job: it always runs and passes only
# when every job above passed (or when nothing the PWA depends on changed, and
# the build job skipped its steps on purpose).
# A failed shard can be re-run alone; it downloads the same bundles.
# scripts/__tests__/ci-workflows.test.mjs keeps this layout honest.

on:
  # No path filter: this job is a required check on main, and a required
  # check that never runs blocks docs-only PRs. The jobs run
  # on every PR and skip the build + e2e when nothing they cover changed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "apps/web/**"
      - "packages/**"
      - "content/**"
      - "scripts/build-stories.mjs"

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: PWA · build (release + fixture bundles)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WRANGLER_SEND_METRICS: "false"
    outputs:
      run: ${{ steps.changes.outputs.run }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Inputs of both bundles: the app and its packages; apps/web (the console
      # that merge-console.mjs builds into dist/); content/ (vocab clips map,
      # stories); scripts/build-stories.mjs (the fixture build); and CI itself.
      - name: Did anything the PWA depends on change?
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/mobile/|apps/web/|packages/|content/|scripts/build-stories\.mjs|\.github/workflows/web-app\.yml|\.github/actions/|scripts/e2e-shard-list\.mjs|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.nvmrc)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No PWA-relevant files changed — build and offline e2e skipped, check reports success."
          fi

      - name: Setup pnpm, Node and dependencies
        if: steps.changes.outputs.run == 'true'
        uses: ./.github/actions/setup-workspace

      # Metro's transform cache is content-addressed (file contents + transform
      # options), so a restored entry is only used for an identical module.
      # Pull requests restore main's cache; main builds cold and saves a fresh
      # one, so the cache never grows run over run.
      - name: Restore the Metro cache (pull requests)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      # Next's own incremental build cache for the console role that
      # merge-console.mjs builds (Next validates every entry itself). Like
      # Metro: pull requests restore main's cache, main builds cold.
      - name: Restore the Next.js build cache (apps/web, console role; pull requests)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: apps/web/.next/cache
          key: next-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            next-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Build PWA (expo export + service worker)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile build:web

      - name: Validate wrangler config (dry run, no upload)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile exec wrangler deploy --dry-run

      # F-STORY-002 PR 2.6a: a second build that holds the test fixtures and the
      # e2e hooks (__hrStoryE2E, __hrPlacementE2E, __hrVocabE2E), written to
      # dist-e2e/ (never dist/, never deployed; the script restores the real
      # story bundle and clip map).
      - name: Build the fixture bundle (dist-e2e, e2e only)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile build:web:fixtures

      # F-STORY-004 PR 4.8b: the same fixtures with content gating on
      # (EXPO_PUBLIC_CONTENT_GATING_ENABLED=true), in dist-e2e-gated/, for
      # story-shelf-gated.spec.ts. The script exports it on a Metro cache of its
      # own (a fresh TMPDIR), so the gating-on transforms never reach the cache
      # the other two builds read or the one main saves.
      - name: Build the gating fixture bundle (dist-e2e-gated, e2e only)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile build:web:fixtures:gated

      # F-PLAN-002 P2-8: the release content with the learner's weekly plan on
      # (EXPO_PUBLIC_ROUTE_ENABLED=true) and Spanish and Korean shown
      # (EXPO_PUBLIC_SHOW_ALL_LOCALES=1), in dist-e2e-route/, for the weekly plan
      # specs (route-proposal, route-plan, route). Like the gating bundle it is
      # exported on a Metro cache of its own, so no flag-on transform reaches
      # the cache the release build reads or the one main saves.
      - name: Build the weekly plan bundle (dist-e2e-route, e2e only)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile build:web:route

      # dist/ holds dot folders (audio clips), so hidden files are included.
      - name: Upload the release build
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: apps/mobile/dist
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload the fixture build
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-e2e
          path: apps/mobile/dist-e2e
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload the gating fixture build
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-e2e-gated
          path: apps/mobile/dist-e2e-gated
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Upload the weekly plan build
        if: steps.changes.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: pwa-dist-e2e-route
          path: apps/mobile/dist-e2e-route
          include-hidden-files: true
          overwrite: true
          if-no-files-found: error
          retention-days: 3

      - name: Save the Metro cache (main only)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: /tmp/metro-cache
          key: metro-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

      - name: Save the Next.js build cache (main only)
        if: steps.changes.outputs.run == 'true' && github.event_name == 'push' && success()
        uses: actions/cache/save@v4
        with:
          path: apps/web/.next/cache
          key: next-console-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}

  e2e:
    name: PWA · offline e2e · shard ${{ matrix.shard }}/4
    needs: [build]
    if: needs.build.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm, Node and dependencies
        uses: ./.github/actions/setup-workspace

      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('./apps/mobile/node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Restore the Playwright browsers
        id: pw-cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

      - name: Install Playwright Chromium (system deps; the browser only on a cache miss)
        run: pnpm --filter @hangul-route/mobile exec playwright install --with-deps chromium

      - name: Download the release build
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist
          path: apps/mobile/dist

      - name: Download the fixture build
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist-e2e
          path: apps/mobile/dist-e2e

      - name: Download the gating fixture build (shard 1)
        if: matrix.shard == 1
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist-e2e-gated
          path: apps/mobile/dist-e2e-gated

      - name: Download the weekly plan build (shard 2)
        if: matrix.shard == 2
        uses: actions/download-artifact@v4
        with:
          name: pwa-dist-e2e-route
          path: apps/mobile/dist-e2e-route

      # Each shard runs its share of the release-build suite, then its share of
      # the fixture-bundle specs. The shares come from scripts/e2e-shard-list.mjs,
      # which deals the listed tests round-robin (Playwright's own --shard cuts
      # the list into contiguous runs, and this suite's long and skipped specs
      # cluster, so its shards came out 4:2:1). --fully-parallel then spreads a
      # share over the workers by test; every test has its own browser context.
      - name: Offline e2e (release build, shard ${{ matrix.shard }} of 4)
        working-directory: apps/mobile
        env:
          SHARD: ${{ matrix.shard }}/4
        shell: bash
        run: |
          pnpm exec playwright test --list > "$RUNNER_TEMP/all-tests.txt"
          node ../../scripts/e2e-shard-list.mjs --shard "$SHARD" < "$RUNNER_TEMP/all-tests.txt" > "$RUNNER_TEMP/shard-tests.txt"
          # The list must select exactly one test per line (none lost, none doubled).
          lines=$(grep -c . "$RUNNER_TEMP/shard-tests.txt")
          selected=$(pnpm exec playwright test --list --test-list "$RUNNER_TEMP/shard-tests.txt" | sed -n 's/^Total: \([0-9]*\) tests\{0,1\} in .*/\1/p')
          if [ "$selected" != "$lines" ]; then
            echo "::error::the shard list has $lines tests but selects ${selected:-none}"
            exit 1
          fi
          pnpm exec playwright test --fully-parallel --test-list "$RUNNER_TEMP/shard-tests.txt"

      # Specs that open screens with no learner entry point yet, through the
      # e2e hooks of the fixture bundle, and read fixture-specific content.
      # With STORY_FIXTURES=1 the Playwright web server serves dist-e2e/.
      # Every listing below goes into one list, dealt round-robin over the
      # shards like the release-build list above.
      - name: Offline e2e (fixture bundle, shard ${{ matrix.shard }} of 4)
        if: ${{ !cancelled() }}
        working-directory: apps/mobile
        env:
          STORY_FIXTURES: "1"
          SHARD: ${{ matrix.shard }}/4
        shell: bash
        run: |
          # Whole spec files. A file filter matches by name: story-reader covers
          # every story-reader-*.spec.ts.
          files=(
            # F-STORY-002 PR 2.6a: the reader, through the __hrStoryE2E hook.
            story-reader
            # F-PLC-001 P-6: the level check screens, through the __hrPlacementE2E hook.
            placement-screens
            # F-PLC-001 P-8: the placement report and Choose a different start.
            placement-report
            # F-STORY-003 PR 3.4a: the story check step inside the fixture story's quest.
            story-checks
            # F-VOC-004 S-4b: the shared vocabulary question view, through the __hrVocabE2E hook.
            vocab-question
            # F-REPORT-001 RP-3b: time-only practice sessions in the story reader and the level check.
            practice-session
            # F-VOC-003 C-4: the Words picker and topic page (Words stays behind its flag until C-7).
            vocab-topics
            # F-VOC-004 S-5: the Speed Round start sheet, questions and results (Words stays behind its flag until C-7).
            vocab-speed
            # F-VOC-003 C-5: the flashcards, the quick check and the chunk summary (Words stays behind its flag until C-7).
            vocab-cards
            # F-STORY-005 PR 5.5b: stories on the Journey, the cell page and its three doors (the fixture shelf stories).
            journey-stories
            # F-STORY-003 PR 3.7 / F-STORY-004 PR 4.6, 4.7: story Results after the fixture story's
            # quest, its Episode page and Culture notes line. The whole file needs the fixture bundle
            # (it used to run only its "Episode page" group, so 5 of its 7 tests ran nowhere).
            story-results
            # F-STORY-004 PR 4.8: the shelf end to end from the learner's entry points (Home story
            # card, resume, Library Story Time and Culture, the story episode page, Culture notes).
            # Anchored on ".spec" so a later story-shelf-*.spec.ts (row 4.8b) is not pulled in here.
            story-shelf.spec
          )
          list() { pnpm exec playwright test --list "$@"; }
          {
            list "${files[@]}"
            # One group of a spec file whose other tests expect the release build.
            # F-STORY-003 PR 3.5b: Story Order scene art plays the fixture story's shelf quest.
            list story-order -g "scene art"
            # F-AUDIO-004 A-6: the clip path (precache, runtime cache, offline clip, clip > voice) on
            # the fixture tones; only that group, since the voice tests expect the release build.
            list audio -g "bundled clips"
          } > "$RUNNER_TEMP/all-tests.txt"
          node ../../scripts/e2e-shard-list.mjs --shard "$SHARD" < "$RUNNER_TEMP/all-tests.txt" > "$RUNNER_TEMP/shard-tests.txt"
          # The list must select exactly one test per line (none lost, none doubled).
          lines=$(grep -c . "$RUNNER_TEMP/shard-tests.txt")
          selected=$(pnpm exec playwright test --list --test-list "$RUNNER_TEMP/shard-tests.txt" | sed -n 's/^Total: \([0-9]*\) tests\{0,1\} in .*/\1/p')
          if [ "$selected" != "$lines" ]; then
            echo "::error::the shard list has $lines tests but selects ${selected:-none}"
            exit 1
          fi
          pnpm exec playwright test --fully-parallel --test-list "$RUNNER_TEMP/shard-tests.txt"

      # F-STORY-004 PR 4.8b: the gating fixture bundle (content gating on, a
      # non-sampler shelf story): the locked tile and its grown-up gate. One
      # short spec, so shard 1 runs it whole. Anchored on ".spec", and the
      # spec skips unless STORY_FIXTURES_GATED is set, so the other runs never
      # run it and this run never runs theirs. Release gate: a build that turns
      # contentGatingEnabled on depends on it. F-ENT-003 E3-11: free-days.spec
      # runs here too; only its gating fixture group (the QuestPlayer guard on a
      # closed quest) runs on this bundle, its other groups skip.
      - name: Offline e2e (gating fixture bundle, shard 1)
        if: ${{ !cancelled() && matrix.shard == 1 }}
        working-directory: apps/mobile
        env:
          STORY_FIXTURES_GATED: "1"
        run: pnpm exec playwright test story-shelf-gated.spec free-days.spec

      # F-PLAN-002 P2-8 (section 6, before the flip of flags.routeEnabled): the
      # weekly plan bundle. E2E_ROUTE=1 serves dist-e2e-route/ and turns on the
      # flag-on describes: the proposal, the set-up steps, the preview, the
      # overview, the Hoya check-in, the seven-day window and the 320 px pass in
      # Spanish and Korean. One spec path each, anchored on the directory so
      # "route.spec" never pulls in my-route.spec.ts.
      - name: Offline e2e (weekly plan bundle, shard 2)
        if: ${{ !cancelled() && matrix.shard == 2 }}
        working-directory: apps/mobile
        env:
          E2E_ROUTE: "1"
        run: pnpm exec playwright test e2e/web/route-proposal.spec e2e/web/route-plan.spec e2e/web/route.spec

      - name: Save the Playwright browsers (main only)
        if: github.event_name == 'push' && steps.pw-cache.outputs.cache-hit != 'true' && success()
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}-${{ steps.pw.outputs.version }}

  pwa:
    name: Build PWA · offline e2e
    needs: [build, e2e]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Every PWA job passed (or nothing the PWA depends on changed)
        env:
          BUILD: ${{ needs.build.result }}
          RUN: ${{ needs.build.outputs.run }}
          E2E: ${{ needs.e2e.result }}
        run: |
          echo "build: $BUILD (PWA-relevant change: $RUN)"
          echo "e2e shards (release build + fixture bundle): $E2E"
          if [ "$BUILD" != success ]; then
            echo "::error::The PWA build job did not pass."
            exit 1
          fi
          if [ "$RUN" != true ]; then
            echo "Nothing the PWA depends on changed: build and e2e skipped on purpose."
            exit 0
          fi
          if [ "$E2E" != success ]; then
            echo "::error::An e2e job did not pass."
            exit 1
          fi
