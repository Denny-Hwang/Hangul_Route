name: Web App (PWA)

# Merge gate for the learner web app: build the static export + service
# worker and run the offline Playwright e2e. Deployment itself is done by
# Cloudflare Workers Builds (Connect GitHub) on every push to main — see
# docs/launch/web-app-launch.md §2 — so this workflow never uploads.

on:
  # No path filter: this job is a required check on main, and a required
  # check that never runs blocks docs-only or console-only PRs. The job runs
  # on every PR and skips the build + e2e when nothing it covers changed.
  pull_request:
    branches: [main]
  push:
    branches: [main]
    paths:
      - "apps/mobile/**"
      - "packages/**"

concurrency:
  group: web-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-e2e:
    name: Build PWA · offline e2e
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: "false"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Did anything the PWA depends on change?
        id: changes
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git fetch --no-tags --depth=1 origin "${{ github.event.pull_request.base.sha }}"
          changed=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" "${{ github.sha }}")
          echo "$changed"
          if echo "$changed" | grep -qE '^(apps/mobile/|packages/|\.github/workflows/web-app\.yml|package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|turbo\.json|\.nvmrc)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No PWA-relevant files changed — build and offline e2e skipped, check reports success."
          fi

      - name: Setup pnpm
        if: steps.changes.outputs.run == 'true'
        uses: pnpm/action-setup@v4

      - name: Setup Node
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        if: steps.changes.outputs.run == 'true'
        run: pnpm install --frozen-lockfile

      - name: Build PWA (expo export + service worker)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile build:web

      - name: Validate wrangler config (dry run, no upload)
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile exec wrangler deploy --dry-run

      - name: Install Playwright Chromium
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile exec playwright install --with-deps chromium

      - name: Offline e2e
        if: steps.changes.outputs.run == 'true'
        run: pnpm --filter @hangul-route/mobile test:e2e:web

      # F-STORY-002 PR 2.6a: the reader has no learner entry point until
      # F-STORY-004's shelf, so its e2e opens it through the __hrStoryE2E hook
      # and reads fixture-specific content. Both exist only in a second build
      # that holds the test fixtures, written to dist-e2e/ (never dist/, never
      # deployed; the script restores the real story bundle).
      # F-PLC-001 P-6: the level check has no entry point until P-7 either; its
      # screen e2e opens it through the __hrPlacementE2E hook of the same bundle.
      - name: Story reader e2e (fixture bundle)
        if: steps.changes.outputs.run == 'true'
        run: |
          pnpm --filter @hangul-route/mobile build:web:fixtures
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test story-reader placement-screens
          # F-STORY-003 PR 3.5b: Story Order scene art plays the fixture story's shelf quest.
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test story-order -g "scene art"
          # F-PLC-001 P-8: the placement report and Choose a different start.
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test placement-report
          # F-STORY-003 PR 3.4a: the story check step inside the fixture story's quest.
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test story-checks
          # F-STORY-004 PR 4.6 / 4.7: Results' Episode page opens the story variant of the episode page,
          # and its Culture notes line opens that story's notes.
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test story-results -g "Episode page"
          # F-AUDIO-004 A-6: the clip path (precache, runtime cache, offline clip, clip > voice) on
          # the fixture tones; only that group, since the voice tests expect the regular build.
          STORY_FIXTURES=1 pnpm --filter @hangul-route/mobile exec playwright test audio -g "bundled clips"
