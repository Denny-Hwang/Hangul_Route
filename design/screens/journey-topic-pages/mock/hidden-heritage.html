<script>
(() => {
  const st = new URLSearchParams(location.hash.slice(1)).get('state') || 'ask';
  const S = (id) => document.querySelector('[data-spot="' + id + '"]');
  if (st === 'debug') document.querySelectorAll('.spot').forEach((s) => s.classList.add('debug'));
  if (st === 'found' || st === 'miss' || st === 'hint') S('guk').classList.add('found');
  if (st === 'miss') S('banchan').classList.add('miss');
  if (st === 'hint') S('bap').classList.add('hint');
  document.querySelectorAll('[data-show]').forEach((el) => { el.hidden = !el.dataset.show.split(' ').includes(st); });
})();
</script>
