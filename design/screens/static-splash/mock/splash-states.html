<!doctype html>
<!-- FN-2 mock board: the splash in each shipped UI language, still (reduced motion), and at 200 % text on 320. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Static splash: states</title>
<link rel="stylesheet" href="splash.css">
<style>
  /* Design-board layout only (not UI): frames side by side, labels in monospace. */
  body { font-family: Menlo, Courier, monospace; padding: 16px; }
  .board { display: flex; flex-wrap: wrap; gap: 24px; align-items: flex-start; }
  .frame { display: flex; flex-direction: column; gap: 8px; }
  .frame > code { font-size: 12px; color: #6F614D; }
  .phone { position: relative; width: 375px; height: 667px; border: 1px dashed #6F614D; overflow: hidden; }
  .phone.narrow { width: 320px; height: 568px; }
  .phone .hr-splash { position: absolute; }
  .phone.text200 .hr-splash { font-size: 200%; }
  .phone.text200 .hr-splash-mark { width: 8rem; height: 8rem; font-size: calc(var(--typography-size-prompt) * 2); }
  .phone.text200 .hr-splash-name { font-size: calc(var(--typography-size-title) * 2); }
  .phone.text200 .hr-splash-line { font-size: calc(var(--typography-size-body) * 2); }
  .still .hr-splash-line { animation: none; }
</style>
</head>
<body>
<div class="board">
  <div class="frame">
    <code>A. English (default, and when nothing is stored or detected)</code>
    <div class="phone" lang="en">
      <div class="hr-splash"><div class="hr-splash-mark" aria-hidden="true">HR</div><p class="hr-splash-name">Hangul Route</p><p class="hr-splash-line">Loading</p></div>
    </div>
  </div>
  <div class="frame">
    <code>B. Español (stored choice, or a Spanish browser)</code>
    <div class="phone" lang="es">
      <div class="hr-splash"><div class="hr-splash-mark" aria-hidden="true">HR</div><p class="hr-splash-name">Hangul Route</p><p class="hr-splash-line">Cargando</p></div>
    </div>
  </div>
  <div class="frame">
    <code>C. 한국어, reduced motion (no breathing)</code>
    <div class="phone still" lang="ko">
      <div class="hr-splash"><div class="hr-splash-mark" aria-hidden="true">HR</div><p class="hr-splash-name">Hangul Route</p><p class="hr-splash-line">불러오는 중</p></div>
    </div>
  </div>
  <div class="frame">
    <code>D. 320 x 568, text 200 %</code>
    <div class="phone narrow text200" lang="en">
      <div class="hr-splash"><div class="hr-splash-mark" aria-hidden="true">HR</div><p class="hr-splash-name">Hangul Route</p><p class="hr-splash-line">Loading</p></div>
    </div>
  </div>
</div>
</body>
</html>
