<body class="page">
<div class="device fill"><div class="vscreen"><div class="vcol"><div class="ctop"><span class="pill">2 / 5</span><p class="heading">Build the block you hear</p><span class="btn btn-ghost btn-sm" role="button">Skip</span></div>
<div class="sb-top"><div class="stack"><span class="speaker sm" role="button" aria-label="Hear bap"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" style="fill: currentColor"/><path d="M16.5 9 Q18.5 12 16.5 15 M19 7 Q22 12 19 17" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"/></svg></span><span class="hear reg-only" role="button" aria-label="Hear bap again"><svg class="icon" width="24" height="24" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" style="fill: currentColor"/><path d="M16.5 9 Q18.5 12 16.5 15 M19 7 Q22 12 19 17" style="fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round"/></svg>Hear it again</span><div class="meaning-btn" role="button" aria-label="Meaning: rice, a meal. Show how it sounds"><span class="gloss">rice, a meal</span><span class="link-line">Show how it sounds</span></div></div>
<div class="block" role="group" aria-label="Block"><div class="zone filled" role="button" aria-label="First letter, ㅂ, letter bieup" lang="ko">ㅂ</div><div class="zone" role="button" aria-label="Vowel, empty"></div><div class="zone final" role="button" aria-label="Final, empty"></div></div></div>
<div class="stack" role="group" aria-label="First letter"><span class="caption">First letter</span><div class="trow"><div class="jt " role="button" aria-label="ㄱ, letter giyeok"><span class="g" lang="ko">ㄱ</span></div><div class="jt sel" role="button" aria-label="ㅂ, letter bieup"><span class="g" lang="ko">ㅂ</span></div><div class="jt " role="button" aria-label="ㅁ, letter mieum"><span class="g" lang="ko">ㅁ</span></div><div class="jt " role="button" aria-label="ㄷ, letter digeut"><span class="g" lang="ko">ㄷ</span></div></div></div>
<div class="stack" role="group" aria-label="Vowel"><span class="caption">Vowel</span><div class="trow"><div class="jt v" role="button" aria-label="ㅏ, letter a"><span class="g" lang="ko">ㅏ</span></div><div class="jt v" role="button" aria-label="ㅓ, letter eo"><span class="g" lang="ko">ㅓ</span></div><div class="jt v" role="button" aria-label="ㅗ, letter o"><span class="g" lang="ko">ㅗ</span></div><div class="jt v" role="button" aria-label="ㅜ, letter u"><span class="g" lang="ko">ㅜ</span></div></div></div>
<div class="stack" role="group" aria-label="Final"><span class="caption">Final</span><div class="trow"><div class="jt f" role="button" aria-label="ㅂ, letter bieup, as a final"><span class="g" lang="ko">ㅂ</span></div><div class="jt f" role="button" aria-label="ㄴ, letter nieun, as a final"><span class="g" lang="ko">ㄴ</span></div><div class="jt f" role="button" aria-label="ㅇ, letter ieung, as a final"><span class="g" lang="ko">ㅇ</span></div><div class="jt word" role="button" aria-label="No final letter">No final</div></div></div></div></div></div>
