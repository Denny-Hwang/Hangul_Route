<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence build, particle tile (LV-S3) - design mock</title>
<link rel="stylesheet" href="presenter.css">
<link rel="stylesheet" href="presenter-v2.css">
<style>/* As built (LV-S3): one place width on the line; empty places in border.shape */ .build-line > .tile { box-sizing: border-box; width: calc(2em + 3 * var(--u) * var(--spacing-n-sm) + 3 * var(--s-prompt) + 4 * var(--u) * var(--spacing-n-md) + 6 * var(--stage-line) + 2 * var(--u) * var(--spacing-n-xl)); justify-content: center; } .build-line > .tile.empty { min-width: 0; border-color: var(--colors-border-shape); }</style>
</head>
<body>
<!-- As built (LV-S3, 2026-10-20): tiles drop the sentence mark (가요, never 가요.); every place on the line takes the one widest-tile width (buildPlaceWidth); an empty place is dashed in border.shape (3:1 on paper); a build is never named by its sentence: arriving says "Build a sentence" (grid.kind.build) and the question its stage shows, after the words already on the line; a forward move says "{word} placed"; the whole build says the sentence with its romanization and meaning. See ../slide-sentence-build.md "As built (LV-S3)". -->
<!-- Revised 2026-10-16 (owner report, DN-0): no helper picker, no language chips; Back and Display (Aa) in the header; the grouped Customize chooser (AMENDMENTS-LECTURE-V2.md section 18). -->
<!-- Design mock (LV-0b, docs/specs/AMENDMENTS-LECTURE-V2.md), not shipped code. Every UI string is a dictionary value or a key of the amendment's section 12 (or a key proposed in ../presets.md / ../slide-families.md "Strings"); Korean, romanization, glosses and titles are shipped content. -->
<div class="presenter">
<div class="stage-box">
<section class="stage" role="main" tabindex="-1" aria-label="Slide 21 of 31, Build a sentence">
<p class="visually-hidden" aria-live="polite">달걀 placed</p>
<span class="counter" aria-hidden="true">21 / 31</span>
<div class="slide slide-v2"><div class="kind-row"><p class="kind-label">Build the sentence together</p></div><p class="s-prompt">Which ending fits?</p><div class="build-line"><span class="tile"><span class="ko " lang="ko">저녁에</span></span><span class="tile"><span class="ko " lang="ko">달걀</span><span class="choice"><span class="ko " lang="ko">을</span></span><span class="slash" aria-hidden="true">/</span><span class="choice"><span class="ko " lang="ko">를</span></span></span><span class="tile empty" aria-hidden="true"></span></div><div class="bank"><span class="tile ghost" aria-hidden="true"><span class="ko " lang="ko">저녁에</span></span><span class="tile"><span class="ko " lang="ko">아침에</span></span><span class="tile ghost" aria-hidden="true"><span class="ko " lang="ko">달걀</span></span><span class="tile"><span class="ko " lang="ko">먹어요</span></span></div></div>
</section>

</div>
<div class="bar" role="toolbar" aria-label="Lesson controls">
<div class="status"></div>
<div class="controls"><button class="ctl " type="button"><svg class="icon"  width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M14.5 6 L8.5 12 L14.5 18" fill="none" stroke="var(--colors-text-primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Previous</span></button><button class="ctl primary" type="button"><svg class="icon"  width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M9.5 6 L15.5 12 L9.5 18" fill="none" stroke="var(--colors-text-onPrimary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Next</span></button><button class="ctl " type="button"><svg class="icon"  width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="var(--colors-text-primary)"/><path d="M16.5 9 Q18.5 12 16.5 15" fill="none" stroke="var(--colors-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 7 Q22 12 19 17" fill="none" stroke="var(--colors-text-primary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Sound</span></button><button class="ctl " type="button"><span>Timer</span></button><button class="ctl " type="button"><span>Blank</span></button><button class="ctl " type="button"><span>Slides</span></button><button class="ctl " type="button" aria-pressed="true"><span>Full screen</span></button><button class="ctl " type="button"><svg class="icon"  width="28" height="28" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6.5 6.5 L17.5 17.5" fill="none" stroke="var(--colors-text-primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/><path d="M17.5 6.5 L6.5 17.5" fill="none" stroke="var(--colors-text-primary)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg><span>Exit</span></button></div>
</div>
</div>
</div>
<script src="presenter.js"></script>
</body>
</html>
