<div class="slide slide-v2 tight"><p class="kind-label">Sentence pattern</p><div class="prompt-line" data-b="0"><span class="ko ko-title" lang="ko"><span class="slot" role="img" aria-label="gap"></span>을/를 먹어요.</span><span class="rom-body">___eul/reul meogeoyo</span><span class="gloss-body">I eat ___.</span></div><p class="note" data-b="1">Put <span class="kt-chip"><span class="ko " lang="ko">을</span><span class="rom">eul</span></span> after a final consonant or <span class="kt-chip"><span class="ko " lang="ko">를</span><span class="rom">reul</span></span> after a vowel on the thing you eat or drink.</p><ol class="examples one-col"><li class="example one" data-b="2"><span class="seq-num" aria-hidden="true">1</span><span class="ko-prompt"><span class="ko " lang="ko">밥을 먹어요.</span></span><span class="rom-body">babeul meogeoyo</span><span class="gloss-body">I eat rice.</span></li><li class="example one" data-b="3"><span class="seq-num" aria-hidden="true">2</span><span class="ko-prompt"><span class="ko " lang="ko">사과를 먹어요.</span></span><span class="rom-body">sagwareul meogeoyo</span><span class="gloss-body">I eat an apple.</span></li></ol></div>
