<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Route blend: every weekly plan line form (BL-D mock)</title>
<link rel="stylesheet" href="route-blend.css">
<script src="strings.js"></script>
</head>
<body>
<!--
  Amendment section 7: the weekly plan line for 1, 2, 3, 5, 6 and 7 practice days, with one and two class days.
  Each item is drawn at the Route card column width (the board column). Assumption d is measured on
  route-line.html at 320 x 568 by tools/capture.mjs; this board shows the forms side by side.
-->
<main class="board">
  <h1 class="board-title">Weekly plan line forms (amendment section 7; wireframe journey/route-class-blend.md B1)</h1>
  <div class="board-grid" id="grid"></div>
</main>
<script>
window.beforeApply = (RB) => {
  const cases = [
    ['1 class day, 1 practice day', [2], [3]],
    ['1 class day, 3 practice days (the owner example)', [2], [3, 5, 0]],
    ['2 class days, 3 practice days', [1, 4], [2, 5, 6]],
    ['1 class day, 5 practice days: "most days"', [2], [3, 4, 5, 6, 0]],
    ['1 class day, 6 practice days: "every day except"', [2], [3, 4, 5, 6, 0, 1]],
    ['1 class day, 7 practice days (Tuesday after class too): "every day"', [2], [3, 4, 5, 6, 0, 1, 2]],
    ['2 class days, 5 practice days (every other day): "most days"', [1, 4], [2, 3, 5, 6, 0]],
  ];
  document.getElementById('grid').innerHTML = cases.map(([label, c, p]) =>
    `<div class="board-item"><p class="board-label">${label}</p><p class="card plan-line">${RB.planLine(c, p)}</p></div>`).join('');
};
</script>
</body>
</html>
