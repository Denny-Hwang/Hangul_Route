document.addEventListener('click', function (e) {
  var t = e.target.closest('[data-toggle]');
  if (t) {
    var p = document.getElementById(t.getAttribute('aria-controls'));
    var open = t.getAttribute('aria-expanded') !== 'true';
    t.setAttribute('aria-expanded', String(open));
    if (p) p.hidden = !open;
    return;
  }
  var r = e.target.closest('[role="radio"]');
  if (r && !r.hasAttribute('aria-disabled')) {
    var g = r.closest('[role="radiogroup"]');
    g.querySelectorAll('[role="radio"]').forEach(function (x) { x.setAttribute('aria-checked', String(x === r)); x.tabIndex = x === r ? 0 : -1; });
    var live = g.querySelector('[data-live]');
    if (live) live.textContent = r.getAttribute('data-picked');
  }
});
