<!doctype html>
<html lang="en">
<head>
<!-- F-APP-001 design pass: dist/grown-ups-offline.html exactly as apps/mobile/scripts/pwa/grown-ups.mjs (A-2, merged) renders it on this commit; copied here for the shots, not edited. -->
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#B24915">
<title>You&#39;re offline</title>
<style>
  /* F-APP-001 section 3.12: grown-up pages need the internet; learning does not. Tokens only. */
  *, *::before, *::after { box-sizing: border-box; }
  html, body { margin: 0; background: #FCF8F1; color: #2A1F14; }
  body {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 16px;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    font-size: 18px;
    line-height: 1.35;
  }
  main {
    width: 100%;
    max-width: 720px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 16px;
    text-align: center;
  }
  svg { width: 64px; height: 64px; color: #857360; }
  h1 {
    margin: 0;
    font-size: 28px;
    line-height: 1.15;
    font-weight: 700;
    overflow-wrap: anywhere;
  }
  p { margin: 0; color: #5C4A36; overflow-wrap: anywhere; }
  .actions {
    width: 100%;
    max-width: 400px;
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-top: 8px;
  }
  a {
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 64px;
    padding: 8px 24px;
    border: 2px solid #B24915;
    border-radius: 16px;
    font-size: 20px;
    font-weight: 600;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  a.primary { background: #B24915; color: #FFFFFF; }
  a.secondary { background: #FFFFFF; color: #B24915; }
  a:focus-visible { outline: 3px solid #3A7FB5; outline-offset: 2px; }
</style>
</head>
<body>
<main>
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" focusable="false">
    <path d="M3.51 10.51a12 12 0 0 1 16.98 0M6.34 13.34a8 8 0 0 1 11.32 0M9.17 16.17a4 4 0 0 1 5.66 0M12 19h.01"/>
    <path d="M4 4l16 16" stroke="#FCF8F1" stroke-width="4"/>
    <path d="M4 4l16 16"/>
  </svg>
  <h1 data-k="title">You&#39;re offline</h1>
  <p data-k="line">Grown-up pages need the internet. Learning still works offline.</p>
  <div class="actions">
    <a class="primary" href="/" data-k="back">Back to learning</a>
    <a class="secondary" href="" data-k="retry">Try again</a>
  </div>
</main>
<script>
(function () {
  var m = {"en":{"lang":"en","title":"You're offline","line":"Grown-up pages need the internet. Learning still works offline.","back":"Back to learning","retry":"Try again"}};
  var langs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''];
  for (var i = 0; i < langs.length; i++) {
    var t = m[String(langs[i]).toLowerCase().split('-')[0]];
    if (!t) continue;
    document.documentElement.lang = t.lang;
    document.title = t.title;
    var nodes = document.querySelectorAll('[data-k]');
    for (var j = 0; j < nodes.length; j++) nodes[j].textContent = t[nodes[j].getAttribute('data-k')];
    return;
  }
})();
</script>
</body>
</html>
