<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realia Read: menu, asking (F-CURR-001 D-2)</title>
<link rel="stylesheet" href="realia-read.css">
</head>
<body>
<div class="rr-screen" lang="en">
<div class="rr-inner">
<div class="rr-top"><div class="rr-bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="0" aria-label="Progress"><span style="width: 0%"></span></div><span class="rr-count">1 / 4</span></div>
<div class="rr-body">
<div class="rr-realia-col"><figure class="realia realia-menu" role="group" aria-label="Menu, 4 lines">
<svg class="dress dress-top" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<rect x="0" y="0" width="400" height="8" rx="3" style="fill: var(--colors-text-secondary);"/>
<path d="M0 8 H50 V30 Q25 40 0 30 Z" style="fill: var(--colors-theme-life); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M50 8 H100 V30 Q75 40 50 30 Z" style="fill: var(--colors-surface-paper); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M100 8 H150 V30 Q125 40 100 30 Z" style="fill: var(--colors-theme-life); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M150 8 H200 V30 Q175 40 150 30 Z" style="fill: var(--colors-surface-paper); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M200 8 H250 V30 Q225 40 200 30 Z" style="fill: var(--colors-theme-life); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M250 8 H300 V30 Q275 40 250 30 Z" style="fill: var(--colors-surface-paper); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M300 8 H350 V30 Q325 40 300 30 Z" style="fill: var(--colors-theme-life); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<path d="M350 8 H400 V30 Q375 40 350 30 Z" style="fill: var(--colors-surface-paper); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
</svg>
<div class="sheet">
<p class="sheet-title" lang="ko"><span>메뉴</span><span class="rl-rom">menyu</span></p>
<ul class="lines">
<li><button class="rl" type="button" data-line="gimbap" aria-label="김밥, gimbap, 2,000원, icheon won"><span class="rl-part "><span class="rl-ko" lang="ko">김밥</span><span class="rl-rom">gimbap</span></span><span class="rl-leader" aria-hidden="true"></span><span class="rl-part rl-value"><span class="rl-ko" lang="ko">2,000원</span><span class="rl-rom">icheon won</span></span></button></li>
<li><button class="rl" type="button" data-line="tteokbokki" aria-label="떡볶이, tteokbokki, 3,000원, samcheon won"><span class="rl-part "><span class="rl-ko" lang="ko">떡볶이</span><span class="rl-rom">tteokbokki</span></span><span class="rl-leader" aria-hidden="true"></span><span class="rl-part rl-value"><span class="rl-ko" lang="ko">3,000원</span><span class="rl-rom">samcheon won</span></span></button></li>
<li><button class="rl" type="button" data-line="ramyeon" aria-label="라면, ramyeon, 3,000원, samcheon won"><span class="rl-part "><span class="rl-ko" lang="ko">라면</span><span class="rl-rom">ramyeon</span></span><span class="rl-leader" aria-hidden="true"></span><span class="rl-part rl-value"><span class="rl-ko" lang="ko">3,000원</span><span class="rl-rom">samcheon won</span></span></button></li>
<li><button class="rl" type="button" data-line="bibimbap" aria-label="비빔밥, bibimbap, 5,000원, ocheon won"><span class="rl-part "><span class="rl-ko" lang="ko">비빔밥</span><span class="rl-rom">bibimbap</span></span><span class="rl-leader" aria-hidden="true"></span><span class="rl-part rl-value"><span class="rl-ko" lang="ko">5,000원</span><span class="rl-rom">ocheon won</span></span></button></li>
</ul>
</div>
<svg class="dress dress-bottom" viewBox="0 0 400 32" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<rect x="0" y="0" width="400" height="8" rx="3" style="fill: var(--colors-text-secondary);"/>
<rect x="12" y="8" width="376" height="24" style="fill: var(--colors-theme-life); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<rect x="40" y="8" width="6" height="24" style="fill: var(--colors-text-secondary);"/><rect x="354" y="8" width="6" height="24" style="fill: var(--colors-text-secondary);"/>
</svg>
</figure><p class="rr-hint">Tap a line to hear it.</p></div>
<div class="rr-ask">
<h1 class="rr-question">How much is this?</h1>
<span class="kt rr-key" aria-label="Korean: 라면, ramyeon"><span class="kt-chip" lang="ko">라면</span><span class="kt-rom">ramyeon</span></span>
<div class="options"><button class="cc" type="button" data-state="idle" aria-label="Korean: 이천 원, icheon won"><span class="kt"><span class="kt-chip" lang="ko">이천 원</span><span class="kt-rom">icheon won</span></span></button>
<button class="cc" type="button" data-state="idle" aria-label="Korean: 삼천 원, samcheon won"><span class="kt"><span class="kt-chip" lang="ko">삼천 원</span><span class="kt-rom">samcheon won</span></span></button>
<button class="cc" type="button" data-state="idle" aria-label="Korean: 오천 원, ocheon won"><span class="kt"><span class="kt-chip" lang="ko">오천 원</span><span class="kt-rom">ocheon won</span></span></button></div>
<div class="hoya-line" role="status" aria-live="polite"></div>
</div>
</div>
</div>
</div>
<script>
/* Mock only: a line tap reveals its romanization in the tap-mode frame (the app also plays the line). */
document.querySelectorAll('.romanization-tap .rl').forEach(function (b) { b.addEventListener('click', function () { b.setAttribute('data-revealed', ''); }); });
</script>
</body>
</html>
