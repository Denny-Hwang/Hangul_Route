<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Realia Read: trail sign, found (F-CURR-001 D-2)</title>
<link rel="stylesheet" href="realia-read.css">
</head>
<body>
<div class="rr-screen" lang="en">
<div class="rr-inner">
<div class="rr-top"><div class="rr-bar" role="progressbar" aria-valuemin="0" aria-valuemax="4" aria-valuenow="1" aria-label="Progress"><span style="width: 25%"></span></div><span class="rr-count">2 / 4</span></div>
<div class="rr-body">
<div class="rr-realia-col"><figure class="realia realia-sign" role="group" aria-label="Trail sign, 3 lines">
<svg class="dress dress-top" viewBox="0 0 400 40" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<polygon points="0,40 70,8 130,30 200,2 270,28 330,10 400,40" style="fill: var(--colors-theme-nature); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
<polygon points="186,9 200,2 214,9 207,12 200,8 193,12" style="fill: var(--colors-surface-paper);"/>
</svg>
<div class="sign">
<span class="post" aria-hidden="true"></span>
<p class="plate sheet-title" lang="ko" style="border-bottom-width: var(--border-width-base); padding: var(--spacing-xs) var(--spacing-md)"><span>산길</span><span class="rl-rom">sangil</span></p>
<ul class="lines" style="gap: var(--spacing-sm)">
<li class="sign-board to-right"><button class="rl" type="button" data-line="summit" data-state="found" aria-label="정상, jeongsang, 1시간, han sigan, to the right. summit, 1 hour, to the right. Found here"><span class="rl-part "><span class="rl-ko" lang="ko">정상</span><span class="rl-rom">jeongsang</span></span><span class="rl-part rl-value"><span class="rl-ko" lang="ko">1시간</span><span class="rl-rom">han sigan</span></span><svg class="rl-mark rl-mark-found" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 L10 17.5 L19 7" style="fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"/></svg><span class="rl-gloss">summit, 1 hour, to the right</span></button><span class="arrow" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M6 16 H24 M17 8 L25 16 L17 24" style="fill: none; stroke: var(--colors-text-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"/></svg></span></li>
<li class="sign-board to-left"><button class="rl" type="button" data-line="entrance" aria-label="입구, ipgu, to the left"><span class="rl-part "><span class="rl-ko" lang="ko">입구</span><span class="rl-rom">ipgu</span></span></button><span class="arrow" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M26 16 H8 M15 8 L7 16 L15 24" style="fill: none; stroke: var(--colors-text-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"/></svg></span></li>
<li class="sign-board to-left"><button class="rl" type="button" data-line="exit" aria-label="출구, chulgu, to the left"><span class="rl-part "><span class="rl-ko" lang="ko">출구</span><span class="rl-rom">chulgu</span></span></button><span class="arrow" aria-hidden="true"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M26 16 H8 M15 8 L7 16 L15 24" style="fill: none; stroke: var(--colors-text-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"/></svg></span></li>
</ul>
</div>
<svg class="dress dress-bottom" viewBox="0 0 400 32" preserveAspectRatio="none" aria-hidden="true" focusable="false">
<rect x="194" y="0" width="12" height="24" rx="2" style="fill: var(--colors-text-secondary);"/>
<ellipse cx="200" cy="26" rx="120" ry="5" style="fill: var(--colors-theme-nature); opacity: 0.6"/>
<ellipse cx="150" cy="24" rx="14" ry="6" style="fill: var(--colors-surface-sunken); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/><ellipse cx="256" cy="25" rx="10" ry="5" style="fill: var(--colors-surface-sunken); stroke: var(--colors-border-shape); stroke-width: 1; stroke-linecap: round; stroke-linejoin: round;"/>
</svg>
</figure><p class="rr-hint">Tap a line to hear it.</p></div>
<div class="rr-ask">
<h1 class="rr-question">Which way is the summit?</h1>
<span class="kt rr-key" aria-label="Korean: 정상, jeongsang"><span class="kt-chip" lang="ko">정상</span><span class="kt-rom">jeongsang</span></span>
<div class="options"><button class="cc" type="button" data-state="disabled" aria-label="Korean: 왼쪽, oenjjok, left" aria-disabled="true"><span class="cc-art" style="display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M26 16 H8 M15 8 L7 16 L15 24" style="fill: none; stroke: var(--colors-text-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"/></svg></span><span class="kt"><span class="kt-chip" lang="ko">왼쪽</span><span class="kt-rom">oenjjok</span></span></button>
<button class="cc" type="button" data-state="correct" aria-label="Right answer: Korean: 오른쪽, oreunjjok, right" aria-disabled="true"><span class="cc-art" style="display:flex;align-items:center;justify-content:center"><svg viewBox="0 0 32 32" aria-hidden="true" focusable="false"><path d="M6 16 H24 M17 8 L25 16 L17 24" style="fill: none; stroke: var(--colors-text-primary); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round;"/></svg></span><span class="kt"><span class="kt-chip" lang="ko">오른쪽</span><span class="kt-rom">oreunjjok</span></span><svg class="cc-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 L10 17.5 L19 7" style="fill: none; stroke-width: 2.6; stroke-linecap: round; stroke-linejoin: round"/></svg></button></div>
<div class="hoya-line" role="status" aria-live="polite"></div>
</div>
</div>
</div>
</div>
<script>
/* Mock only: a line tap reveals its romanization in the tap-mode frame (the app also plays the line). */
document.querySelectorAll('.romanization-tap .rl').forEach(function (b) { b.addEventListener('click', function () { b.setAttribute('data-revealed', ''); }); });
</script>
</body>
</html>
