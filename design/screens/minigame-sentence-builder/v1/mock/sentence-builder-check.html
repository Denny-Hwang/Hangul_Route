<head>

<body>
<!-- F-CURR-001 D-1 design mock (design/screens/minigame-sentence-builder/v1/spec.md). Korean content is sample content taken from the spec's tables (F-CURR-001 sections 3.4, 3.5, 3.7); the cell rows author the real content. Strings are the drafts in spec.md "Strings" or existing dictionary values. Pictures are stand-ins for HeritageCardArt / WordArt. Links are placeholders. -->
<main class="screen"><div class="mg-head"><span class="dots" aria-hidden="true"><i class="on"></i><i></i></span><span class="pill">Quick check</span></div>
<div><h1 class="mg-heading">Build the sentence</h1><p class="mg-instr">Tap the words in order.</p></div>
<section class="meaning" aria-label="Meaning"><div class="words"><p class="caption">Meaning</p><p class="says">I like tteokguk.</p></div><button class="btn btn-secondary btn-small" type="button" aria-label="Hear it, the sentence"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="var(--colors-text-onSecondary)"/><path d="M16.5 9 Q18.5 12 16.5 15" fill="none" stroke="var(--colors-text-onSecondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 7 Q22 12 19 17" fill="none" stroke="var(--colors-text-onSecondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hear it</button></section>
<div class="line" role="list" aria-label="The sentence"><span class="slot w3 next" role="listitem" aria-label="Place 1 of 3, empty"></span><span class="slot w3" role="listitem" aria-label="Place 2 of 3, empty"></span><span class="slot w3" role="listitem" aria-label="Place 3 of 3, empty"></span></div>
<hr class="tray-sep">
<div class="tray" role="group" aria-label="Word tiles"><button type="button" class="tile "><span class="ko" lang="ko">좋아해요</span><span class="rom">joahaeyo</span></button><button type="button" class="tile "><span class="ko" lang="ko">저는</span><span class="rom">jeoneun</span></button><button type="button" class="tile "><span class="ko" lang="ko">떡국을</span><span class="rom">tteokgugeul</span></button></div></main>
</body>
