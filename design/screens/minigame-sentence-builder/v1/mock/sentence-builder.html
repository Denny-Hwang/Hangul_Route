<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sentence Builder: F-CURR-001 D-1 mock</title>
<link rel="stylesheet" href="./sentence-builder.css">
</head>
<body>
<!-- F-CURR-001 D-1 design mock (design/screens/minigame-sentence-builder/v1/spec.md). Korean content is sample content taken from the spec's tables (F-CURR-001 sections 3.4, 3.5, 3.7); the cell rows author the real content. Strings are the drafts in spec.md "Strings" or existing dictionary values. Pictures are stand-ins for HeritageCardArt / WordArt. Links are placeholders. -->
<main class="screen"><div class="mg-head"><div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="5" aria-valuenow="1"><i style="width:20%"></i></div><span class="pill">2 / 5</span></div>
<div><h1 class="mg-heading">Build the sentence</h1><p class="mg-instr">Tap the words in order.</p></div>
<section class="meaning" aria-label="Meaning"><svg class="pic" viewBox="0 0 96 96" aria-hidden="true" focusable="false"><rect x="2" y="2" width="92" height="92" rx="12" fill="var(--colors-surface-sunken)"/><ellipse cx="48" cy="46" rx="30" ry="12" fill="var(--colors-surface-paper)" stroke="var(--colors-border-shape)" stroke-width="2"/><path d="M18 48 Q20 74 48 76 Q76 74 78 48 Z" fill="var(--colors-brand-secondaryLight)" stroke="var(--colors-border-shape)" stroke-width="2" stroke-linejoin="round"/><path d="M36 80 H60" stroke="var(--colors-border-shape)" stroke-width="3" stroke-linecap="round"/></svg><div class="words"><p class="caption">Meaning</p><p class="says">I eat rice.</p></div><button class="btn btn-secondary btn-small" type="button" aria-label="Hear it, the sentence"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9 H8 L13 5 V19 L8 15 H4 Z" fill="var(--colors-text-onSecondary)"/><path d="M16.5 9 Q18.5 12 16.5 15" fill="none" stroke="var(--colors-text-onSecondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M19 7 Q22 12 19 17" fill="none" stroke="var(--colors-text-onSecondary)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>Hear it</button></section>
<div class="line" role="list" aria-label="The sentence"><span role="listitem"><span class="tile placed" aria-label="Place 1 of 2: 밥을, babeul"><span class="ko" lang="ko">밥을</span><span class="rom">babeul</span><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 12.5 L10 17.5 L19 6.5" fill="none" stroke="var(--colors-feedback-successDark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/></svg></span></span><span class="slot w3 next" role="listitem" aria-label="Place 2 of 2, empty"></span></div>
<hr class="tray-sep">
<div class="tray" role="group" aria-label="Word tiles"><button type="button" class="tile "><span class="ko" lang="ko">먹어요</span><span class="rom">meogeoyo</span></button><button type="button" class="tile tried" aria-label="물을, mureul, tried"><span class="ko" lang="ko">물을</span><span class="rom">mureul</span><svg class="mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M7 12 H17" fill="none" stroke="var(--colors-text-primary)" stroke-width="2.6" stroke-linecap="round"/></svg></button></div>
<div class="bubble-row" role="status"><svg class="hoya" viewBox="0 0 128 128" aria-hidden="true" focusable="false"><ellipse cx="64" cy="116" rx="38" ry="5" fill="var(--colors-hoya-furDark)" opacity="0.2"/><circle cx="64" cy="64" r="44" fill="var(--colors-hoya-fur)"/><circle cx="30" cy="32" r="12" fill="var(--colors-hoya-fur)"/><circle cx="98" cy="32" r="12" fill="var(--colors-hoya-fur)"/><circle cx="30" cy="32" r="6" fill="var(--colors-hoya-cheek)" opacity="0.85"/><circle cx="98" cy="32" r="6" fill="var(--colors-hoya-cheek)" opacity="0.85"/><path d="M26 54 Q30 58 26 62 M24 70 Q29 73 25 78 M28 84 Q33 86 30 90 M102 54 Q98 58 102 62 M104 70 Q99 73 103 78 M100 84 Q95 86 98 90 M64 24 Q66 30 64 36" fill="none" stroke="var(--colors-hoya-stripes)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><ellipse cx="64" cy="84" rx="26" ry="16" fill="var(--colors-hoya-belly)"/><ellipse cx="51" cy="68" rx="3" ry="4.5" fill="var(--colors-hoya-stripes)"/><ellipse cx="79" cy="68" rx="3" ry="4.5" fill="var(--colors-hoya-stripes)"/><circle cx="52" cy="66.5" r="1" fill="var(--colors-surface-paper)"/><circle cx="80" cy="66.5" r="1" fill="var(--colors-surface-paper)"/><path d="M58 84 H70 L64 90 Z" fill="var(--colors-hoya-nose)"/><path d="M53 96 Q60 92 67 96" fill="none" stroke="var(--colors-hoya-stripes)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="100" cy="26" r="2.5" fill="var(--colors-surface-paper)" stroke="var(--colors-brand-secondary)" stroke-width="1"/><circle cx="106" cy="18" r="3.5" fill="var(--colors-surface-paper)" stroke="var(--colors-brand-secondary)" stroke-width="1"/><rect x="108" y="2" width="18" height="12" rx="6" fill="var(--colors-surface-paper)" stroke="var(--colors-brand-secondary)" stroke-width="2"/></svg><div class="bubble thinking"><p>Not that one yet. Try another word.</p></div></div>
<div class="skip-row"><button class="btn btn-quiet" type="button">Skip</button></div></main>
</body>
</html>
