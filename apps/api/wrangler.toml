# Cloudflare Worker — the API (Hono, packages/backend). Deployed by Cloudflare
# Workers Builds ("Connect GitHub") on every push to main; the owner never runs
# wrangler locally. Dashboard settings (docs/launch/owner-runbook.md Step 3):
#
#   Project name  : hangul-route-api        (must equal `name` below)
#   Root directory: /
#   Build command : pnpm install --frozen-lockfile
#   Deploy command: pnpm --filter @hangul-route/api exec wrangler d1 migrations apply hangul-route --remote && pnpm --filter @hangul-route/api exec wrangler deploy
#                   (two steps on one line: migrations first, then the upload; see the D1 block below)
#
# Variables vs secrets (Workers Builds redeploys on every merge):
#   - `keep_vars = true` keeps plain-text variables entered in the dashboard
#     (Settings → Variables and Secrets) across deploys; without it wrangler
#     replaces the Worker's variables with the [vars] block of this file.
#   - Secrets (Type: Secret in the dashboard) always survive a deploy; wrangler
#     never deletes or overwrites a secret it does not define.
#   - Bindings (D1, KV, R2) do NOT survive: a deploy replaces them with what this
#     file declares, so bindings live here and change through a PR.
name = "hangul-route-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]
keep_vars = true

# ---- Secrets (dashboard → Settings → Variables and Secrets → Add → Type: Secret) ----
# CLERK_SECRET_KEY        Clerk → API Keys → Secret key (F-AUTH-001; without it every
#                         signed-in route answers 503 auth_not_configured — the API
#                         fails closed, GET /health shows bindings.clerk = false)
# CLERK_JWT_KEY           optional — networkless JWT verification
# STRIPE_SECRET_KEY       Stripe → Developers → API keys (F-ENT-001)
# STRIPE_WEBHOOK_SECRET   Stripe → Developers → Webhooks → the endpoint's signing
#                         secret (POST /api/entitlements/stripe/webhook)
# RESCUE_PEPPER           optional — a long random string (e.g. `openssl rand -hex 32`);
#                         new Rescue Codes are stored as HMAC(pepper, code) instead of
#                         plain SHA-256 (SEC-5). Codes issued before it was set keep
#                         working. NEVER change or delete it once set: codes hashed
#                         under it would stop restoring. Unset = plain SHA-256, as
#                         before. GET /health shows bindings.rescuePepper (true/false)
#                         so a monitor can see it took effect, or vanish.

# ---- Variables (dashboard → same page → Type: Text; kept by keep_vars) ----
# ALLOWED_ORIGINS                    comma-separated browser origins allowed on /api/*
#                                    (F-CONSOLE-001). Unset = hangulroute.com / www / app
#                                    + localhost + *.workers.dev previews.
#                                    Also the Clerk authorizedParties list (F-APP-001 A-9): a
#                                    sign-in token minted on a site left out here gets 401. In
#                                    production (ENVIRONMENT unset) tokens get the list alone,
#                                    never the localhost / *.workers.dev leniency.
# STRIPE_PRICE_FAMILY_YEARLY         Stripe price id — Family Plan, $15.30 / year, recurring
#                                    (owner decision 2026-10-11). The old
#                                    STRIPE_PRICE_FAMILY_LIFETIME (one-off) is not read; delete it.
#                                    Set it only after this Worker and the web console both run
#                                    the yearly build; until then checkout is stripe_not_configured.
# STRIPE_PRICE_GROUP_LICENSE_YEARLY  Stripe price id — $153 / year, recurring
# CONSOLE_URL                        checkout success / cancel return, e.g. https://hangulroute.com
#                                    (success adds ?checkout=success&plan=<planKey>&id=<spaceId>,
#                                    F-BILL-002 B-5; the space id is opaque, no name in the URL)
# BILLING_LIVE_ALLOWED               F-BILL-002 section 4.9, OD-12: leave UNSET. With a live Stripe
#                                    key (sk_live_ / rk_live_, or any key without a test prefix)
#                                    checkout, portal, promo (and receipt links, B-4) answer 503
#                                    live_not_enabled; only the exact text "true" opens them. The
#                                    webhook keeps working in every mode. GET /health shows
#                                    bindings.stripeLive and bindings.billingLiveAllowed (booleans).
#                                    Set it only together with the owner's decision to go live.
# SCHOOL_CONSENT_MODE                "enabled" only after the legal review (decision #27)
# NOTES_SEND                         F-FEEDBACK-001 section 7.8, OD-19. Only the exact
#                                    text "enabled" opens the two note send routes
#                                    (GET /api/spaces/:id/notes/recipients, POST /api/spaces/:id/notes);
#                                    otherwise both answer 404 before auth. Owner decision 2026-10-13
#                                    (OD-19, FB-14): set it to "enabled" in the dashboard now (runbook
#                                    F-4). Keep it out of [vars]: a [vars] value returns on every
#                                    deploy, so unsetting it would no longer stop sending without one.
#                                    GET /health shows features.notesSend.
# CLASS_TRANSFER                     [TV] Owner decision 2026-10-14 (AMENDMENTS-TEACHER-VISIBILITY-TRANSFER
#                                    TV-D13): ON BY DEFAULT. Unset or "enabled" opens class moves (the
#                                    console routes under /api/spaces/:id/transfer-requests,
#                                    .../class-moves and .../transfer-prefs, the learner device routes
#                                    under /api/sync/learners/:id/transfer-*, and the inbox fields).
#                                    Kill switch: set it to "disabled" (any value other than "enabled"
#                                    locks): every move route answers 422 transfers_locked, a pending
#                                    accept or a scheduled move stops at once, the inbox says
#                                    transfersEnabled: false. Keep it out of [vars] (a [vars] value
#                                    returns on every deploy). GET /health shows features.classTransfer.
#                                    Runbook: docs/launch/owner-runbook.md section H.
# CLASS_TRANSFER_DEVICE_CONSENT      F-SPACE-002 decision A4: leave UNSET, also after
#                                    CLASS_TRANSFER is on. Only "enabled" lets a learner's own
#                                    device start a move or say yes (POST .../transfer-requests and
#                                    .../:tid/approve under /api/sync/learners/:id); otherwise both
#                                    answer 422 device_consent_locked and a device yes already given
#                                    is held, not acted on. A device can always decline or cancel
#                                    (that needs only CLASS_TRANSFER). Set it only after written
#                                    counsel sign-off that a device attestation is acceptable as
#                                    learner-side consent (flip gate G6).
# CLASS_SCOPE_FULL                   AMENDMENTS-TEACHER-VISIBILITY-TRANSFER TV-D15: leave UNSET (on).
#                                    Unset, empty or "enabled" lets a class teacher or school admin
#                                    read a learner's full progress (words included) once the family
#                                    has acknowledged the class-scope update. "disabled" (or any other
#                                    value) is the kill switch: every class and school reader sees the
#                                    base scope at once; families are unaffected and acknowledgements
#                                    still record. GET /health shows features.classScopeFull.
# LEARNING_ROLLUPS                   F-CURR-002 section 11.2 (row CM-70a): leave UNSET (on). Unset,
#                                    empty or "enabled" lets POST /api/telemetry add counts to the
#                                    D1 table learning_rollups (codes and counts only, under a write
#                                    budget of 20,000 rows a day). "disabled" (or any other value) is
#                                    the kill switch: no rollup row is written; events are still
#                                    accepted. Keep it out of [vars] (a [vars] value returns on every
#                                    deploy).
# ENVIRONMENT                        unset = production (fail closed: no Clerk key or no
#                                    D1 binding → 503). Only "development" / "test" turn on
#                                    the dev fallbacks (bearer = account id, in-memory Db
#                                    without D1) — set those in a local .dev.vars, never on
#                                    the deployed Worker. "production" can never opt in.
# ALLOW_DEV_AUTH                     "true" also turns on the dev fallbacks (local only);
#                                    ignored when ENVIRONMENT=production. With ENVIRONMENT
#                                    unset and Clerk or D1 missing, GET /health answers
#                                    503 misconfigured so a monitor catches it.
#
# The same keys may be set here instead; a [vars] value wins over a dashboard
# value of the same name on the next deploy.
# [vars]
# ALLOWED_ORIGINS = "https://hangulroute.com,https://www.hangulroute.com,https://app.hangulroute.com"

# ---- D1 (F-INFRA-002 / F-INFRA-003) ----
# Database created in the dashboard on 2026-10-07 (Storage & Databases → D1,
# location automatic / WNAM, no jurisdiction). Schema files live in ./migrations
# and are applied by the Workers Builds deploy command BEFORE the upload:
#   pnpm --filter @hangul-route/api exec wrangler d1 migrations apply hangul-route --remote && pnpm --filter @hangul-route/api exec wrangler deploy
# D1 records applied files in its d1_migrations table, so re-running is a no-op.
# The Worker persists schema v2 through this binding (F-INFRA-003): learners,
# devices, snapshots, accounts, spaces, memberships, plans, relink requests and
# entitlements survive redeploys. Without the binding the API answers 503
# db_not_configured, unless ENVIRONMENT=development|test (local dev, tests),
# where the same code runs on an in-memory Db.
[[d1_databases]]
binding = "DB"
database_name = "hangul-route"
database_id = "4d338c01-0a0d-46c5-b7f4-16936cf32907"
migrations_dir = "migrations"

# ---- Cron Trigger (F-FEEDBACK-001 section 8.7, PR FB-3b) ----
# Once a day at 11:17 UTC the Worker's `scheduled` handler (src/index.ts) runs
# the bounded retention purge: notes past 180 days, reported notes 90 days after
# their newest report, lifted holds after 365 days, and dead rate counters, at
# most 5 rounds of 200 rows. The same run then evaluates the F-CURR-002
# guardrails (row CM-70b) and only lowers a breached ramp in remote_config.
# Cron Triggers are allowed on the Workers Free plan;
# the deploy command is unchanged (wrangler deploy registers the schedule).
[triggers]
crons = ["17 11 * * *"]
