name = "hangul-route-api"
main = "src/index.ts"
compatibility_date = "2024-11-12"
compatibility_flags = ["nodejs_compat"]

# Auth (F-AUTH-001): bind Clerk keys as secrets (never commit them):
#   wrangler secret put CLERK_SECRET_KEY
#   wrangler secret put CLERK_JWT_KEY   # optional — networkless JWT verification
# With no keys bound, getAuthUserId uses a dev fallback (bearer = user id).

# D1 binding (F-INFRA-002). database_id is a deploy-time placeholder:
#   1. wrangler d1 create hangul-route
#   2. paste the printed database_id below
#   3. wrangler d1 migrations apply hangul-route   (applies src/db/schema.sql)
# Real env.DB queries replace the in-memory store in F-INFRA-003.
# R2 / KV bindings land with later F-XXX specs.
[[d1_databases]]
binding = "DB"
database_name = "hangul-route"
database_id = "PLACEHOLDER_RUN_WRANGLER_D1_CREATE"

# School consent mode (F-TCH-001 §10.3) stays locked until the owner's legal review
# (app-map decision #27). Set to "enabled" to let class settings switch to school mode.
# [vars]
# SCHOOL_CONSENT_MODE = "enabled"

# CORS (F-CONSOLE-001): comma-separated browser origins allowed on /api/*.
# Unset = hangulroute.com / www / app + localhost + *.workers.dev previews.
# [vars]
# ALLOWED_ORIGINS = "https://hangulroute.com,https://www.hangulroute.com,https://app.hangulroute.com"

# Stripe (F-ENT-001): web checkout for the two products (decision #30).
#   wrangler secret put STRIPE_SECRET_KEY
#   wrangler secret put STRIPE_WEBHOOK_SECRET   # from the webhook endpoint (POST /api/entitlements/stripe/webhook)
# Price ids as vars; unset = checkout answers stripe_not_configured.
# [vars]
# STRIPE_PRICE_FAMILY_LIFETIME       = "price_..."   # $15.30, one-time (Stripe price type: one-off)
# STRIPE_PRICE_GROUP_LICENSE_YEARLY  = "price_..."   # $153 / year, recurring
# CONSOLE_URL = "https://hangulroute.com"   # checkout success / cancel return
